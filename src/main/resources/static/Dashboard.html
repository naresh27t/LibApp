<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Library System</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f8fafc;
            padding: 30px 20px;
        }

        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Top Navigation Header */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-size: 22px;
        }

        .user-details h2 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        .user-details p {
            color: #94a3b8;
            font-size: 13px;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        /* Overview Stat Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .icon-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .icon-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .icon-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .stat-data h3 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .stat-data p {
            font-size: 13px;
            color: #94a3b8;
        }

        /* Section Container */
        .content-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .section-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Books Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        th:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        th:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }

        td {
            padding: 16px;
            color: #cbd5e1;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Navbar Header -->
        <div class="navbar">
            <div class="user-info">
                <div class="avatar">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <div class="user-details">
                    <h2 id="studentName">Loading account...</h2>
                    <p>Logged in successfully</p>
                </div>
            </div>
            <a href="/logout" class="btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>

        <!-- Summary Metric Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon icon-blue">
                    <i class="fa-solid fa-book"></i>
                </div>
                <div class="stat-data">
                    <h3 id="bookCount">--</h3>
                    <p>Books Registered</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon icon-green">
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                </div>
                <div class="stat-data">
                    <h3 id="studentFee">--</h3>
                    <p>Fee in Account Record</p>
                </div>
            </div>
        </div>

        <!-- Book History Table -->
        <div class="content-card">
            <div class="section-header">
                <h3><i class="fa-solid fa-book-open"></i> Registered Book</h3>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Book Title</th>
                            <th>Fee in Account Record</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="bookTitle" style="font-weight: 600; color: #ffffff;">Loading...</td>
                            <td id="bookFee">--</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch("/api/dashboard", {
                    headers: { "Accept": "application/json" }
                });
                if (response.status === 401) {
                    window.location.replace("/signin");
                    return;
                }
                if (!response.ok) {
                    throw new Error(`Dashboard request failed (${response.status})`);
                }

                const student = await response.json();
                const hasBook = Boolean(student.books && student.books.trim());
                document.getElementById("studentName").textContent = student.studentname;
                document.getElementById("bookCount").textContent = hasBook ? "1" : "0";
                document.getElementById("studentFee").textContent = `₹${student.fee}`;
                document.getElementById("bookTitle").textContent = hasBook ? student.books : "No book registered";
                document.getElementById("bookFee").textContent = `₹${student.fee}`;
            } catch (error) {
                document.getElementById("studentName").textContent = "Unable to load account";
                document.getElementById("bookTitle").textContent = "Account data could not be loaded";
                document.getElementById("bookFee").textContent = "--";
                console.error("Unable to load student dashboard:", error);
            }
        });
    </script>
</body>
</html>
