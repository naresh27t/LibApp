trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

# 1. Define the MySQL container resource
resources:
  containers:
    - container: mysql
      image: mysql:8.0
      env:
        MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        MYSQL_DATABASE: libsystem
      ports:
        - 3306:3306

jobs:
- job: Build
  # 2. Attach the defined container as a service to this job
  services:
    mysql: mysql

  steps:
  - task: Maven@4
    inputs:
      mavenPomFile: 'pom.xml'
      mavenOptions: '-Xmx3072m'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.17'       # Change to '1.17' (or supported JDK version)
      jdkArchitectureOption: 'x64'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      goals: 'clean package'
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/libsystem
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ''
      SPRING_JPA_HIBERNATE_DDL_AUTO: update